kind: source
name: wallet-bq
type: bigquery
project: ${GOOGLE_CLOUD_PROJECT}
location: ${GOOGLE_CLOUD_LOCATION}
---
kind: tool
name: execute_sql
type: bigquery-execute-sql
source: wallet-bq
description: >
  Run a GoogleSQL statement against the Cymbal Wallet data in BigQuery.
  Dataset wallet_support has the tables customers, transactions,
  linked_accounts, merchants and refunds. Use this for any question the
  other tools do not cover.
---
kind: tool
name: get_customer_profile
type: bigquery-sql
source: wallet-bq
description: >
  Get one customer's profile: name, email, tier, balance, account status and
  tax ID.
statement: |
  SELECT customer_id, full_name, email, tier, balance_usd, status, tax_id
  FROM wallet_support.customers
  WHERE customer_id = @customer_id
parameters:
  - name: customer_id
    type: string
    description: Customer ID, such as cust_0001.
annotations:
  readOnlyHint: true
---
kind: tool
name: get_linked_accounts
type: bigquery-sql
source: wallet-bq
description: Get the bank accounts a customer has linked to their wallet.
statement: |
  SELECT bank_name, account_type, account_number, added_on
  FROM wallet_support.linked_accounts
  WHERE customer_id = @customer_id
parameters:
  - name: customer_id
    type: string
    description: Customer ID, such as cust_0001.
annotations:
  readOnlyHint: true
---
kind: tool
name: get_refunds
type: bigquery-sql
source: wallet-bq
description: Get a customer's refund requests and the current status of each.
statement: |
  SELECT refund_id, txn_id, reason, status, requested_on, updated_on
  FROM wallet_support.refunds
  WHERE customer_id = @customer_id
  ORDER BY requested_on DESC
parameters:
  - name: customer_id
    type: string
    description: Customer ID, such as cust_0001.
annotations:
  readOnlyHint: true
